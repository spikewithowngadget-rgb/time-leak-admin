<!doctype html>
<html lang="kz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimeLeak Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <script src="/config.js"></script>
  </head>
  <body class="dashboard-page">
    <div class="page-noise" aria-hidden="true"></div>

    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-card brand-panel">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true">
              <span></span>
              <span></span>
            </div>
            <div>
              <p class="brand-name">TimeLeak Admin</p>
              <p class="brand-subtitle" data-i18n="brand_subtitle"></p>
            </div>
          </div>
        </div>

        <div class="sidebar-card nav-panel">
          <p class="section-label" data-i18n="sidebar_label"></p>
          <nav class="nav-list" aria-label="Primary">
            <button type="button" class="nav-item" disabled data-i18n="nav_overview"></button>
            <button type="button" class="nav-item is-active" data-i18n="nav_campaigns"></button>
            <button type="button" class="nav-item" disabled data-i18n="nav_reports"></button>
            <button type="button" class="nav-item" disabled data-i18n="nav_settings"></button>
          </nav>
        </div>

        <div class="sidebar-card focus-panel">
          <p class="section-label" data-i18n="sidebar_focus_label"></p>
          <h2 class="panel-title" data-i18n="sidebar_focus_title"></h2>
          <p class="panel-copy" data-i18n="sidebar_focus_copy"></p>
        </div>

        <div class="sidebar-card session-panel">
          <p class="section-label" data-i18n="session_label"></p>
          <div class="session-user-badge" id="session-user-badge">Admin</div>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="dashboard-topbar">
          <div class="topbar-copy">
            <p class="eyebrow" data-i18n="dashboard_eyebrow"></p>
            <h1 class="page-title" data-i18n="dashboard_title"></h1>
            <p class="page-copy" data-i18n="dashboard_subtitle"></p>
          </div>

          <div class="topbar-actions">
            <label class="search-field" for="search-input">
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M14.17 14.18 18 18m-1.75-8.25a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" />
              </svg>
              <input id="search-input" type="search" autocomplete="off" data-i18n-placeholder="search_placeholder" aria-label="Search ads" />
            </label>

            <div class="field compact-field">
              <label for="language-select" data-i18n="language_label"></label>
              <select id="language-select" aria-label="Language">
                <option value="kz" data-i18n="lang_kz"></option>
                <option value="ru" data-i18n="lang_ru"></option>
                <option value="en" data-i18n="lang_en"></option>
              </select>
            </div>

            <button id="logout-button" type="button" class="btn btn-secondary" data-i18n="logout"></button>
          </div>
        </header>

        <section class="stats-grid" aria-label="Overview">
          <article class="stat-card">
            <p class="stat-label" data-i18n="stat_total_label"></p>
            <p id="stat-total" class="stat-value">0</p>
            <p class="stat-note" data-i18n="stat_total_note"></p>
          </article>
          <article class="stat-card">
            <p class="stat-label" data-i18n="stat_loaded_label"></p>
            <p id="stat-loaded" class="stat-value">0</p>
            <p class="stat-note" data-i18n="stat_loaded_note"></p>
          </article>
          <article class="stat-card">
            <p class="stat-label" data-i18n="stat_active_label"></p>
            <p id="stat-active" class="stat-value">0</p>
            <p class="stat-note" data-i18n="stat_active_note"></p>
          </article>
          <article class="stat-card">
            <p class="stat-label" data-i18n="stat_inactive_label"></p>
            <p id="stat-inactive" class="stat-value">0</p>
            <p class="stat-note" data-i18n="stat_inactive_note"></p>
          </article>
        </section>

        <section class="content-grid">
          <section class="panel table-panel">
            <div class="panel-head">
              <div>
                <p class="section-label" data-i18n="table_label"></p>
                <h2 class="panel-title" data-i18n="table_title"></h2>
                <p id="table-panel-summary" class="panel-copy"></p>
              </div>

              <div class="panel-actions">
                <div class="field compact-field">
                  <label for="active-filter" data-i18n="filter_active"></label>
                  <select id="active-filter">
                    <option value="all" data-i18n="filter_all"></option>
                    <option value="active" data-i18n="filter_active_only"></option>
                    <option value="inactive" data-i18n="filter_inactive_only"></option>
                  </select>
                </div>

                <div class="field compact-field">
                  <label for="limit-select" data-i18n="limit_label"></label>
                  <select id="limit-select">
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                  </select>
                </div>

                <button id="refresh-button" type="button" class="btn btn-secondary" data-i18n="refresh"></button>
                <button id="open-create-dialog" type="button" class="btn btn-primary" data-i18n="open_create"></button>
              </div>
            </div>

            <div class="table-card">
              <table>
                <thead>
                  <tr>
                    <th class="col-index" data-i18n="col_index"></th>
                    <th data-i18n="col_campaign"></th>
                    <th data-i18n="col_destination"></th>
                    <th data-i18n="col_status"></th>
                    <th data-i18n="col_created"></th>
                    <th data-i18n="col_updated"></th>
                    <th data-i18n="col_actions"></th>
                  </tr>
                </thead>
                <tbody id="ads-table-body"></tbody>
              </table>
            </div>

            <div id="table-empty" class="empty-state" hidden>
              <h3 class="empty-title" data-i18n="table_empty_title"></h3>
              <p class="empty-copy" data-i18n="table_empty_copy"></p>
              <button id="open-create-empty" type="button" class="btn btn-primary" data-i18n="table_empty_action"></button>
            </div>

            <footer class="table-footer">
              <p id="pagination-info" class="footer-note"></p>
              <div class="footer-actions">
                <div class="offset-group">
                  <label for="offset-input" data-i18n="offset_label"></label>
                  <input id="offset-input" type="number" min="0" step="1" value="0" />
                  <button id="offset-apply" type="button" class="btn btn-secondary" data-i18n="apply_offset"></button>
                </div>

                <div class="page-actions">
                  <button id="prev-page" type="button" class="btn btn-secondary" data-i18n="prev_page"></button>
                  <button id="next-page" type="button" class="btn btn-secondary" data-i18n="next_page"></button>
                </div>
              </div>
            </footer>
          </section>

          <section class="panel inspector-panel">
            <div class="panel-head">
              <div>
                <p class="section-label" data-i18n="inspector_label"></p>
                <h2 class="panel-title" data-i18n="inspector_title"></h2>
              </div>
            </div>

            <div id="inspector-empty" class="inspector-empty">
              <h3 class="empty-title" data-i18n="inspector_empty_title"></h3>
              <p class="empty-copy" data-i18n="inspector_empty_copy"></p>
            </div>

            <div id="inspector-card" class="inspector-card" hidden>
              <div id="inspector-media" class="inspector-media">
                <div id="inspector-fallback" class="media-fallback">TL</div>
                <img id="inspector-image" alt="" hidden />
              </div>

              <div class="inspector-header">
                <div>
                  <h3 id="inspector-title" class="inspector-title"></h3>
                  <p id="inspector-id" class="inspector-id"></p>
                </div>
                <span id="inspector-status" class="status-chip"></span>
              </div>

              <dl class="inspector-meta">
                <div>
                  <dt data-i18n="inspector_target_label"></dt>
                  <dd><a id="inspector-target" target="_blank" rel="noopener noreferrer"></a></dd>
                </div>
                <div>
                  <dt data-i18n="inspector_image_label"></dt>
                  <dd><a id="inspector-image-link" target="_blank" rel="noopener noreferrer"></a></dd>
                </div>
                <div>
                  <dt data-i18n="inspector_status_label"></dt>
                  <dd id="inspector-status-text"></dd>
                </div>
                <div>
                  <dt data-i18n="inspector_created_label"></dt>
                  <dd id="inspector-created"></dd>
                </div>
                <div>
                  <dt data-i18n="inspector_updated_label"></dt>
                  <dd id="inspector-updated"></dd>
                </div>
              </dl>

              <div class="inspector-actions">
                <button id="inspector-copy-link" type="button" class="btn btn-secondary" data-i18n="action_copy_link"></button>
                <button id="inspector-edit" type="button" class="btn btn-primary" data-i18n="action_edit"></button>
                <button id="inspector-delete" type="button" class="btn btn-danger" data-i18n="action_delete"></button>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="editor-dialog" class="app-dialog" aria-labelledby="editor-title">
      <div class="dialog-shell dialog-wide">
        <div class="dialog-head">
          <div>
            <h2 id="editor-title" class="panel-title"></h2>
            <p id="editor-subtitle" class="panel-copy"></p>
          </div>
        </div>

        <form id="editor-form" class="dialog-grid" novalidate>
          <div class="dialog-form">
            <div class="field">
              <label for="editor-title-input" data-i18n="field_title"></label>
              <input id="editor-title-input" name="title" type="text" required data-i18n-placeholder="field_title_placeholder" />
            </div>

            <div class="field">
              <label for="editor-image-input" data-i18n="field_image_url"></label>
              <input id="editor-image-input" name="image_url" type="url" required data-i18n-placeholder="field_image_placeholder" />
              <div id="editor-image-inline-preview" class="editor-image-inline-preview">
                <div id="editor-image-inline-fallback" class="media-fallback">TL</div>
                <img id="editor-image-inline-image" alt="" hidden />
              </div>
            </div>

            <div class="field">
              <label for="editor-target-input" data-i18n="field_target_url"></label>
              <input id="editor-target-input" name="target_url" type="url" required data-i18n-placeholder="field_target_placeholder" />
            </div>

            <label class="toggle-row" for="editor-active-input">
              <input id="editor-active-input" name="is_active" type="checkbox" />
              <span data-i18n="field_is_active"></span>
            </label>
          </div>

          <aside class="dialog-preview">
            <p class="section-label" data-i18n="editor_preview_label"></p>
            <div id="editor-preview-media" class="preview-media">
              <div id="editor-preview-fallback" class="media-fallback">TL</div>
              <img id="editor-preview-image" alt="" hidden />
            </div>
            <div class="preview-copy-block">
              <h3 id="editor-preview-title" class="preview-title">Untitled</h3>
              <p id="editor-preview-host" class="preview-host">example.com</p>
              <span id="editor-preview-status" class="status-chip"></span>
              <p class="preview-note" data-i18n="editor_preview_copy"></p>
            </div>
          </aside>

          <div class="dialog-actions">
            <button id="editor-cancel" type="button" class="btn btn-secondary" data-i18n="cancel"></button>
            <button id="editor-submit" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
      </div>
    </dialog>

    <dialog id="delete-dialog" class="app-dialog compact-dialog" aria-labelledby="delete-title">
      <div class="dialog-shell dialog-compact">
        <div class="dialog-head">
          <div>
            <h2 id="delete-title" class="panel-title" data-i18n="delete_title"></h2>
            <p class="panel-copy" data-i18n="delete_description"></p>
          </div>
        </div>

        <p id="delete-target" class="delete-target"></p>

        <div class="dialog-actions">
          <button id="delete-cancel" type="button" class="btn btn-secondary" data-i18n="cancel"></button>
          <button id="delete-confirm" type="button" class="btn btn-danger" data-i18n="delete_confirm"></button>
        </div>
      </div>
    </dialog>

    <div id="toast-container" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/assets/js/ads.js"></script>
  </body>
</html>
