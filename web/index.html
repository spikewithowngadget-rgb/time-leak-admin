<!doctype html>
<html lang="kz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimeLeak Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/styles.css?v=20260531-admin-shell" />
    <script src="/config.js"></script>
  </head>
  <body class="dashboard-page">
    <div class="app-shell">
      <!-- Sidebar / drawer navigation -->
      <aside class="sidebar" id="sidebar" aria-label="Primary">
        <div class="sidebar-brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span></div>
          <div class="brand-text">
            <p class="brand-name">TimeLeak</p>
            <p class="brand-subtitle" data-i18n="brand_subtitle"></p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-group-label" data-i18n="nav_group_main"></p>
          <a class="nav-item" data-nav="overview" href="#overview">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10.5 10 4l7 6.5M5 9v7h10V9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span data-i18n="nav_overview"></span>
          </a>
          <a class="nav-item" data-nav="ads" href="#ads">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.5"/></svg>
            <span data-i18n="nav_ads"></span>
          </a>
          <a class="nav-item" data-nav="geo" href="#geo">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 17s5-4.5 5-8a5 5 0 1 0-10 0c0 3.5 5 8 5 8Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="9" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <span data-i18n="nav_geo"></span>
          </a>

          <p class="nav-group-label" data-i18n="nav_group_audit"></p>
          <a class="nav-item" data-nav="devices" href="#devices">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="3" width="8" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M9 15h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="nav_devices"></span>
          </a>
          <a class="nav-item" data-nav="auth-events" href="#auth-events">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l6 2.5V10c0 3.5-2.5 5.7-6 7-3.5-1.3-6-3.5-6-7V5.5L10 3Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <span data-i18n="nav_auth_events"></span>
          </a>
          <a class="nav-item" data-nav="settings" href="#settings">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6 15 15M15 5l-1.4 1.4M6.4 13.6 5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-i18n="nav_settings"></span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <div class="session-chip">
            <span class="session-avatar" id="session-avatar" aria-hidden="true">A</span>
            <span class="session-name" id="session-user-badge">Admin</span>
          </div>
        </div>
      </aside>

      <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>

      <!-- Main workspace -->
      <div class="workspace">
        <header class="topbar">
          <button id="menu-toggle" class="icon-button menu-toggle" type="button" data-i18n-aria="menu_toggle" aria-label="Menu">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>

          <div class="topbar-heading">
            <h1 class="view-title" id="view-title"></h1>
            <p class="view-subtitle" id="view-subtitle"></p>
          </div>

          <div class="topbar-actions">
            <label class="search-field" id="search-field" for="search-input">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <path d="M14.17 14.18 18 18m-1.75-8.25a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.4" />
              </svg>
              <input id="search-input" type="search" autocomplete="off" aria-label="Search" />
            </label>

            <select id="language-select" class="lang-select" aria-label="Language">
              <option value="kz" data-i18n="lang_kz"></option>
              <option value="ru" data-i18n="lang_ru"></option>
              <option value="en" data-i18n="lang_en"></option>
            </select>

            <button id="logout-button" type="button" class="btn btn-secondary" data-i18n="logout"></button>
          </div>
        </header>

        <main class="view-stack" id="view-stack">
          <!-- ===================== OVERVIEW ===================== -->
          <section class="view" data-view="overview" hidden>
            <div id="overview-state" class="state-block" hidden></div>
            <div id="overview-content">
              <div class="stat-grid" id="overview-stats"></div>
              <section class="panel">
                <div class="panel-head">
                  <div>
                    <p class="section-label" data-i18n="nav_auth_events"></p>
                    <h2 class="panel-title" data-i18n="ov_recent_auth"></h2>
                  </div>
                  <button class="btn btn-ghost" data-nav-link="auth-events" type="button" data-i18n="ov_open_section"></button>
                </div>
                <div id="overview-recent" class="recent-list"></div>
              </section>
            </div>
          </section>

          <!-- ===================== ADS ===================== -->
          <section class="view" data-view="ads" hidden>
            <div class="stat-grid stat-grid-compact" aria-label="Ads overview">
              <article class="stat-card">
                <p class="stat-label" data-i18n="stat_total_label"></p>
                <p id="stat-total" class="stat-value">0</p>
                <p class="stat-note" data-i18n="stat_total_note"></p>
              </article>
              <article class="stat-card">
                <p class="stat-label" data-i18n="stat_loaded_label"></p>
                <p id="stat-loaded" class="stat-value">0</p>
                <p class="stat-note" data-i18n="stat_loaded_note"></p>
              </article>
              <article class="stat-card">
                <p class="stat-label" data-i18n="stat_active_label"></p>
                <p id="stat-active" class="stat-value">0</p>
                <p class="stat-note" data-i18n="stat_active_note"></p>
              </article>
              <article class="stat-card">
                <p class="stat-label" data-i18n="stat_inactive_label"></p>
                <p id="stat-inactive" class="stat-value">0</p>
                <p class="stat-note" data-i18n="stat_inactive_note"></p>
              </article>
            </div>

            <div class="content-grid">
              <section class="panel table-panel">
                <div class="panel-head">
                  <div>
                    <p class="section-label" data-i18n="table_label"></p>
                    <h2 class="panel-title" data-i18n="table_title"></h2>
                    <p id="table-panel-summary" class="panel-copy"></p>
                  </div>
                  <div class="panel-actions">
                    <div class="field compact-field">
                      <label for="active-filter" data-i18n="filter_active"></label>
                      <select id="active-filter">
                        <option value="all" data-i18n="filter_all"></option>
                        <option value="active" data-i18n="filter_active_only"></option>
                        <option value="inactive" data-i18n="filter_inactive_only"></option>
                      </select>
                    </div>
                    <div class="field compact-field">
                      <label for="limit-select" data-i18n="limit_label"></label>
                      <select id="limit-select">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                      </select>
                    </div>
                    <button id="refresh-button" type="button" class="btn btn-secondary" data-i18n="refresh"></button>
                    <button id="open-create-dialog" type="button" class="btn btn-primary" data-i18n="open_create"></button>
                  </div>
                </div>

                <div class="table-scroll">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th class="col-index" data-i18n="col_index"></th>
                        <th data-i18n="col_campaign"></th>
                        <th data-i18n="col_destination"></th>
                        <th data-i18n="col_status"></th>
                        <th data-i18n="col_created"></th>
                        <th data-i18n="col_updated"></th>
                        <th data-i18n="col_actions"></th>
                      </tr>
                    </thead>
                    <tbody id="ads-table-body"></tbody>
                  </table>
                </div>

                <div id="table-empty" class="empty-state" hidden>
                  <h3 class="empty-title" data-i18n="table_empty_title"></h3>
                  <p class="empty-copy" data-i18n="table_empty_copy"></p>
                  <button id="open-create-empty" type="button" class="btn btn-primary" data-i18n="table_empty_action"></button>
                </div>

                <footer class="table-footer">
                  <p id="pagination-info" class="footer-note"></p>
                  <div class="footer-actions">
                    <div class="offset-group">
                      <label for="offset-input" data-i18n="offset_label"></label>
                      <input id="offset-input" type="number" min="0" step="1" value="0" />
                      <button id="offset-apply" type="button" class="btn btn-secondary" data-i18n="apply_offset"></button>
                    </div>
                    <div class="page-actions">
                      <button id="prev-page" type="button" class="btn btn-secondary" data-i18n="prev_page"></button>
                      <button id="next-page" type="button" class="btn btn-secondary" data-i18n="next_page"></button>
                    </div>
                  </div>
                </footer>
              </section>

              <section class="panel inspector-panel">
                <div class="panel-head">
                  <div>
                    <p class="section-label" data-i18n="inspector_label"></p>
                    <h2 class="panel-title" data-i18n="inspector_title"></h2>
                  </div>
                </div>
                <div id="inspector-empty" class="inspector-empty">
                  <h3 class="empty-title" data-i18n="inspector_empty_title"></h3>
                  <p class="empty-copy" data-i18n="inspector_empty_copy"></p>
                </div>
                <div id="inspector-card" class="inspector-card" hidden>
                  <div id="inspector-media" class="inspector-media">
                    <div id="inspector-fallback" class="media-fallback">TL</div>
                    <img id="inspector-image" alt="" hidden />
                  </div>
                  <div class="inspector-header">
                    <div>
                      <h3 id="inspector-title" class="inspector-title"></h3>
                      <p id="inspector-id" class="inspector-id"></p>
                    </div>
                    <span id="inspector-status" class="status-chip"></span>
                  </div>
                  <dl class="inspector-meta">
                    <div><dt data-i18n="inspector_target_label"></dt><dd><a id="inspector-target" target="_blank" rel="noopener noreferrer"></a></dd></div>
                    <div><dt data-i18n="inspector_image_label"></dt><dd><a id="inspector-image-link" target="_blank" rel="noopener noreferrer"></a></dd></div>
                    <div><dt data-i18n="inspector_status_label"></dt><dd id="inspector-status-text"></dd></div>
                    <div><dt data-i18n="inspector_created_label"></dt><dd id="inspector-created"></dd></div>
                    <div><dt data-i18n="inspector_updated_label"></dt><dd id="inspector-updated"></dd></div>
                  </dl>
                  <div class="inspector-actions">
                    <button id="inspector-copy-link" type="button" class="btn btn-secondary" data-i18n="action_copy_link"></button>
                    <button id="inspector-edit" type="button" class="btn btn-primary" data-i18n="action_edit"></button>
                    <button id="inspector-delete" type="button" class="btn btn-danger" data-i18n="action_delete"></button>
                  </div>
                </div>
              </section>
            </div>
          </section>

          <!-- ===================== GEO ANALYTICS ===================== -->
          <section class="view" data-view="geo" hidden>
            <form class="filters-bar" id="geo-filters">
              <div class="field compact-field">
                <label for="geo-range" data-i18n="filter_date_label"></label>
                <select id="geo-range">
                  <option value="7" data-i18n="date_7d"></option>
                  <option value="1" data-i18n="date_today"></option>
                  <option value="30" data-i18n="date_30d"></option>
                  <option value="custom" data-i18n="date_custom"></option>
                </select>
              </div>
              <div class="field compact-field geo-custom" id="geo-custom-from" hidden>
                <label for="geo-from" data-i18n="label_from"></label>
                <input id="geo-from" type="date" />
              </div>
              <div class="field compact-field geo-custom" id="geo-custom-to" hidden>
                <label for="geo-to" data-i18n="label_to"></label>
                <input id="geo-to" type="date" />
              </div>
              <div class="field compact-field">
                <label for="geo-platform" data-i18n="filter_platform_label"></label>
                <select id="geo-platform">
                  <option value="all" data-i18n="platform_all"></option>
                  <option value="ios" data-i18n="platform_ios"></option>
                  <option value="android" data-i18n="platform_android"></option>
                </select>
              </div>
              <div class="field compact-field">
                <label for="geo-source" data-i18n="filter_source_label"></label>
                <select id="geo-source">
                  <option value="all" data-i18n="source_all"></option>
                  <option value="gps" data-i18n="source_gps"></option>
                  <option value="network" data-i18n="source_network"></option>
                  <option value="manual" data-i18n="source_manual"></option>
                  <option value="unknown" data-i18n="source_unknown"></option>
                </select>
              </div>
              <label class="toggle-row inline-toggle" for="geo-active-only">
                <input id="geo-active-only" type="checkbox" />
                <span data-i18n="filter_active_devices_only"></span>
              </label>
              <div class="filters-actions">
                <button type="submit" class="btn btn-primary" data-i18n="common_apply"></button>
                <button type="button" id="geo-reset" class="btn btn-secondary" data-i18n="common_reset"></button>
              </div>
            </form>

            <div class="stat-grid" id="geo-summary"></div>

            <div class="geo-layout">
              <section class="panel map-panel">
                <div class="map-wrap">
                  <div id="geo-map" class="map-canvas"></div>
                  <div id="geo-map-state" class="map-state" hidden></div>
                </div>
              </section>
              <section class="panel regions-panel">
                <div class="panel-head">
                  <div>
                    <p class="section-label" data-i18n="geo_title"></p>
                    <h2 class="panel-title" data-i18n="geo_regions_title"></h2>
                    <p class="panel-copy" data-i18n="geo_regions_subtitle"></p>
                  </div>
                </div>
                <p class="inline-note" data-i18n="geo_approx_note"></p>
                <div class="table-scroll">
                  <table class="data-table">
                    <thead>
                      <tr>
                        <th data-i18n="geo_col_region"></th>
                        <th data-i18n="geo_col_events"></th>
                        <th data-i18n="geo_col_users"></th>
                        <th data-i18n="geo_col_share"></th>
                        <th data-i18n="geo_col_last"></th>
                      </tr>
                    </thead>
                    <tbody id="geo-regions-body"></tbody>
                  </table>
                </div>
                <div id="geo-regions-empty" class="empty-state" hidden>
                  <h3 class="empty-title" data-i18n="common_no_data_title"></h3>
                  <p class="empty-copy" data-i18n="geo_map_empty_copy"></p>
                </div>
              </section>
            </div>
          </section>

          <!-- ===================== DEVICES ===================== -->
          <section class="view" data-view="devices" hidden>
            <form class="filters-bar" id="devices-filters">
              <div class="field compact-field">
                <label for="devices-platform" data-i18n="filter_platform_label"></label>
                <select id="devices-platform">
                  <option value="all" data-i18n="platform_all"></option>
                  <option value="ios" data-i18n="platform_ios"></option>
                  <option value="android" data-i18n="platform_android"></option>
                </select>
              </div>
              <div class="field compact-field">
                <label for="devices-active" data-i18n="filter_active"></label>
                <select id="devices-active">
                  <option value="all" data-i18n="filter_all"></option>
                  <option value="active" data-i18n="filter_active_only"></option>
                  <option value="inactive" data-i18n="filter_inactive_only"></option>
                </select>
              </div>
              <div class="field compact-field">
                <label for="devices-limit" data-i18n="limit_label"></label>
                <select id="devices-limit">
                  <option value="20">20</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
              </div>
            </form>

            <section class="panel table-panel">
              <div class="table-scroll">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th data-i18n="dev_col_user"></th>
                      <th data-i18n="dev_col_platform"></th>
                      <th data-i18n="dev_col_model"></th>
                      <th data-i18n="dev_col_manufacturer"></th>
                      <th data-i18n="dev_col_appver"></th>
                      <th data-i18n="dev_col_osver"></th>
                      <th data-i18n="dev_col_push"></th>
                      <th data-i18n="dev_col_last"></th>
                      <th data-i18n="dev_col_status"></th>
                      <th data-i18n="dev_col_actions"></th>
                    </tr>
                  </thead>
                  <tbody id="devices-tbody"></tbody>
                </table>
              </div>
              <div id="devices-empty" class="empty-state" hidden>
                <h3 class="empty-title" data-i18n="common_no_data_title"></h3>
                <p class="empty-copy" data-i18n="common_no_data_copy"></p>
              </div>
              <footer class="table-footer">
                <p id="devices-info" class="footer-note"></p>
                <div class="page-actions">
                  <button id="devices-prev" type="button" class="btn btn-secondary" data-i18n="prev_page"></button>
                  <button id="devices-next" type="button" class="btn btn-secondary" data-i18n="next_page"></button>
                </div>
              </footer>
            </section>
          </section>

          <!-- ===================== AUTH EVENTS ===================== -->
          <section class="view" data-view="auth-events" hidden>
            <form class="filters-bar" id="auth-filters">
              <div class="field compact-field">
                <label for="auth-event-type" data-i18n="ae_filter_type"></label>
                <select id="auth-event-type">
                  <option value="" data-i18n="ae_event_all"></option>
                  <option value="login_success">login_success</option>
                  <option value="login_failed">login_failed</option>
                  <option value="register_success">register_success</option>
                  <option value="password_reset_success">password_reset_success</option>
                </select>
              </div>
              <div class="field compact-field">
                <label for="auth-phone" data-i18n="ae_col_phone"></label>
                <input id="auth-phone" type="text" autocomplete="off" data-i18n-placeholder="ae_filter_phone_ph" />
              </div>
              <div class="field compact-field">
                <label for="auth-user" data-i18n="ae_col_user"></label>
                <input id="auth-user" type="text" autocomplete="off" data-i18n-placeholder="ae_filter_user_ph" />
              </div>
              <div class="filters-actions">
                <button type="submit" class="btn btn-primary" data-i18n="common_apply"></button>
                <button type="button" id="auth-reset" class="btn btn-secondary" data-i18n="common_reset"></button>
              </div>
            </form>

            <section class="panel table-panel">
              <div class="table-scroll">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th data-i18n="ae_col_type"></th>
                      <th data-i18n="ae_col_phone"></th>
                      <th data-i18n="ae_col_user"></th>
                      <th data-i18n="ae_col_device"></th>
                      <th data-i18n="ae_col_ip"></th>
                      <th data-i18n="ae_col_time"></th>
                    </tr>
                  </thead>
                  <tbody id="auth-events-tbody"></tbody>
                </table>
              </div>
              <div id="auth-events-empty" class="empty-state" hidden>
                <h3 class="empty-title" data-i18n="common_no_data_title"></h3>
                <p class="empty-copy" data-i18n="common_no_data_copy"></p>
              </div>
              <footer class="table-footer">
                <p id="auth-events-info" class="footer-note"></p>
                <div class="page-actions">
                  <button id="auth-prev" type="button" class="btn btn-secondary" data-i18n="prev_page"></button>
                  <button id="auth-next" type="button" class="btn btn-secondary" data-i18n="next_page"></button>
                </div>
              </footer>
            </section>
          </section>

          <!-- ===================== SETTINGS ===================== -->
          <section class="view" data-view="settings" hidden>
            <div class="settings-grid">
              <section class="panel">
                <div class="panel-head"><h2 class="panel-title" data-i18n="set_session_title"></h2></div>
                <dl class="kv-list">
                  <div><dt data-i18n="set_session_user"></dt><dd id="set-session-user">Admin</dd></div>
                  <div><dt data-i18n="set_session_status"></dt><dd><span class="status-chip is-active" data-i18n="set_session_active"></span></dd></div>
                </dl>
                <div class="panel-foot">
                  <button id="settings-logout" type="button" class="btn btn-danger" data-i18n="set_logout_title"></button>
                  <p class="panel-copy" data-i18n="set_logout_copy"></p>
                </div>
              </section>
              <section class="panel">
                <div class="panel-head"><h2 class="panel-title" data-i18n="nav_settings"></h2></div>
                <dl class="kv-list">
                  <div><dt data-i18n="set_api_base"></dt><dd id="set-api-base" class="mono"></dd></div>
                  <div><dt data-i18n="set_maps_key"></dt><dd id="set-maps-status"></dd></div>
                  <div><dt data-i18n="set_language_title"></dt><dd>
                    <select id="settings-language" class="lang-select">
                      <option value="kz" data-i18n="lang_kz"></option>
                      <option value="ru" data-i18n="lang_ru"></option>
                      <option value="en" data-i18n="lang_en"></option>
                    </select>
                  </dd></div>
                </dl>
              </section>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- ===================== ADS EDITOR DIALOG ===================== -->
    <dialog id="editor-dialog" class="app-dialog" aria-labelledby="editor-title">
      <div class="dialog-shell dialog-wide">
        <div class="dialog-head">
          <div>
            <h2 id="editor-title" class="panel-title"></h2>
            <p id="editor-subtitle" class="panel-copy"></p>
          </div>
          <button id="editor-close" type="button" class="icon-button" data-i18n-aria="common_close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>

        <form id="editor-form" class="dialog-grid" novalidate>
          <div class="dialog-form">
            <div class="field">
              <label for="editor-title-input" data-i18n="field_title"></label>
              <input id="editor-title-input" name="title" type="text" required data-i18n-placeholder="field_title_placeholder" />
              <p class="field-error" data-error-for="title" hidden></p>
            </div>
            <div class="field">
              <label for="editor-image-input" data-i18n="field_image_url"></label>
              <input id="editor-image-input" name="image_url" type="url" required data-i18n-placeholder="field_image_placeholder" />
              <p class="field-error" data-error-for="image_url" hidden></p>
            </div>
            <div class="field">
              <label for="editor-target-input" data-i18n="field_target_url"></label>
              <input id="editor-target-input" name="target_url" type="url" required data-i18n-placeholder="field_target_placeholder" />
              <p class="field-error" data-error-for="target_url" hidden></p>
            </div>
            <label class="toggle-row" for="editor-active-input">
              <input id="editor-active-input" name="is_active" type="checkbox" />
              <span data-i18n="field_is_active"></span>
            </label>
          </div>

          <aside class="dialog-preview">
            <p class="section-label" data-i18n="editor_preview_label"></p>
            <div id="editor-preview-media" class="preview-media">
              <div id="editor-preview-fallback" class="media-fallback">TL</div>
              <img id="editor-preview-image" alt="" hidden />
            </div>
            <div class="preview-copy-block">
              <h3 id="editor-preview-title" class="preview-title">Untitled</h3>
              <p id="editor-preview-host" class="preview-host">example.com</p>
              <span id="editor-preview-status" class="status-chip"></span>
              <p class="preview-note" data-i18n="editor_preview_copy"></p>
            </div>
          </aside>

          <div class="dialog-actions">
            <button id="editor-cancel" type="button" class="btn btn-secondary" data-i18n="cancel"></button>
            <button id="editor-submit" type="submit" class="btn btn-primary"></button>
          </div>
        </form>
      </div>
    </dialog>

    <!-- ===================== DELETE DIALOG ===================== -->
    <dialog id="delete-dialog" class="app-dialog compact-dialog" aria-labelledby="delete-title">
      <div class="dialog-shell dialog-compact">
        <div class="dialog-head">
          <div>
            <h2 id="delete-title" class="panel-title" data-i18n="delete_title"></h2>
            <p class="panel-copy" data-i18n="delete_description"></p>
          </div>
        </div>
        <p id="delete-target" class="delete-target"></p>
        <div class="dialog-actions">
          <button id="delete-cancel" type="button" class="btn btn-secondary" data-i18n="cancel"></button>
          <button id="delete-confirm" type="button" class="btn btn-danger" data-i18n="delete_confirm"></button>
        </div>
      </div>
    </dialog>

    <!-- ===================== GEO POINT DIALOG ===================== -->
    <dialog id="geo-point-dialog" class="app-dialog compact-dialog" aria-labelledby="geo-point-title">
      <div class="dialog-shell dialog-compact">
        <div class="dialog-head">
          <h2 id="geo-point-title" class="panel-title" data-i18n="geo_point_title"></h2>
          <button id="geo-point-close" type="button" class="icon-button" data-i18n-aria="common_close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <dl class="kv-list" id="geo-point-body"></dl>
      </div>
    </dialog>

    <!-- ===================== DEVICE DETAILS DRAWER ===================== -->
    <div id="device-drawer" class="drawer" aria-hidden="true">
      <div class="drawer-panel" role="dialog" aria-labelledby="device-drawer-title">
        <header class="drawer-head">
          <div>
            <p class="section-label" data-i18n="nav_devices"></p>
            <h2 id="device-drawer-title" class="panel-title" data-i18n="dev_drawer_title"></h2>
          </div>
          <button id="device-drawer-close" type="button" class="icon-button" data-i18n-aria="common_close" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </header>
        <div class="drawer-body">
          <section class="drawer-section">
            <h3 class="drawer-section-title" data-i18n="dev_drawer_overview"></h3>
            <dl class="kv-list" id="device-drawer-overview"></dl>
            <button id="device-drawer-deactivate" type="button" class="btn btn-danger btn-sm" data-i18n="dev_deactivate"></button>
          </section>
          <section class="drawer-section">
            <h3 class="drawer-section-title" data-i18n="dev_drawer_map_label"></h3>
            <div class="map-wrap map-wrap-sm">
              <div id="device-drawer-map" class="map-canvas"></div>
              <div id="device-drawer-map-state" class="map-state" hidden></div>
            </div>
          </section>
          <section class="drawer-section">
            <h3 class="drawer-section-title" data-i18n="dev_drawer_locations"></h3>
            <div id="device-drawer-locations" class="drawer-list"></div>
          </section>
          <section class="drawer-section">
            <h3 class="drawer-section-title" data-i18n="dev_drawer_auth"></h3>
            <div id="device-drawer-auth" class="drawer-list"></div>
          </section>
        </div>
      </div>
    </div>

    <div id="toast-container" class="toast-wrap" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/assets/js/dashboard.js?v=20260531-yandex-v3"></script>
  </body>
</html>
